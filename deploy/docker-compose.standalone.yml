# Agendia — instalación independiente (licencia de pago único).
#
# Usa imágenes ya construidas en lugar del código fuente: la licencia es de
# uso y no incluye el código. Cada instalación tiene su propia base de datos,
# sus propios contenedores y sus propias copias de seguridad.
#
# Dos formas de usarlo:
#
# 1. Alojada en el servidor de Agendia, detrás del proxy que ya está
#    corriendo (lo habitual: hosting incluido en la licencia). No se ejecuta
#    a mano: lo hace deploy/instance.sh, que suma
#    docker-compose.shared-proxy.yml.
#
# 2. En un servidor aparte, con su propio proxy HTTPS (perfil `proxy`):
#      docker compose -f docker-compose.standalone.yml --profile proxy \
#        --env-file .env.production up -d
#    En ese servidor hacen falta este archivo, Caddyfile, backup.sh y las
#    imágenes (cargadas con `docker load` o desde un registro privado).
#
# La aplicación se llama `app` (y no `web`, como en docker-compose.yml) para
# que el proxy compartido nunca la confunda con la del SaaS.

x-app-env: &app-env
  NODE_ENV: production
  DEPLOYMENT_MODE: standalone
  DATABASE_URL: postgresql://${POSTGRES_USER:-agendia}:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agendia}
  APP_URL: https://${DOMAIN:?definir DOMAIN}
  AUTH_URL: https://${DOMAIN}
  AUTH_SECRET: ${AUTH_SECRET:?definir AUTH_SECRET}
  CRON_SECRET: ${CRON_SECRET:?definir CRON_SECRET}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  TEAM_MODE_ENABLED: ${TEAM_MODE_ENABLED:-}
  TEAM_ACCOUNTS_ENABLED: ${TEAM_ACCOUNTS_ENABLED:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agendia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: ${AGENDIA_MIGRATOR_IMAGE:-agendia-migrator:latest}
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: ${AGENDIA_IMAGE:-agendia-web:latest}
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    image: ${AGENDIA_IMAGE:-agendia-web:latest}
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      WORKER_TARGET_URL: http://app:3000
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  caddy:
    profiles: ["proxy"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      UPSTREAM: app:3000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-agendia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-agendia}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      # Después de las migraciones: la primera copia no debe ser de una base vacía.
      migrate:
        condition: service_completed_successfully
    logging: *logging

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
