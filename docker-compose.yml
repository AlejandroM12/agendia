# Agendia en producción sobre un único servidor (VPS) con Docker Compose.
#
#   caddy    → HTTPS automático (Let's Encrypt) y proxy inverso
#   web      → aplicación Next.js
#   worker   → dispara el trabajo periódico (recordatorios, vencimientos, pagos)
#   migrate  → aplica migraciones pendientes y termina (corre antes que web)
#   postgres → base de datos, con volumen persistente
#   backup   → copia diaria de la base, con rotación
#   offsite  → (opcional, perfil "offsite") sube las copias a un almacenamiento externo
#
# El proxy también atiende a las instalaciones independientes alojadas en
# este servidor (deploy/instance.sh), que se conectan a la red agendia-edge.
#
# Uso: copiar deploy/.env.production.example a .env.production, completarlo y
#   docker compose --env-file .env.production up -d --build
# Guía completa: docs/DEPLOYMENT.md

x-app-env: &app-env
  NODE_ENV: production
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-saas}
  DATABASE_URL: postgresql://${POSTGRES_USER:-agendia}:${POSTGRES_PASSWORD:?definir POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-agendia}
  APP_URL: https://${DOMAIN:?definir DOMAIN}
  AUTH_URL: https://${DOMAIN}
  AUTH_SECRET: ${AUTH_SECRET:?definir AUTH_SECRET}
  CRON_SECRET: ${CRON_SECRET:?definir CRON_SECRET}
  CONTACT_EMAIL: ${CONTACT_EMAIL:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  TEAM_MODE_ENABLED: ${TEAM_MODE_ENABLED:-}
  MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
  MERCADOPAGO_WEBHOOK_SECRET: ${MERCADOPAGO_WEBHOOK_SECRET:-}
  PRICE_MONTHLY: ${PRICE_MONTHLY:-9900}
  PRICE_ONE_TIME: ${PRICE_ONE_TIME:-149000}
  PRICE_LICENSE_RENEWAL: ${PRICE_LICENSE_RENEWAL:-}

x-build: &build
  context: .
  args:
    APP_URL: https://${DOMAIN}
    CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    PRICE_MONTHLY: ${PRICE_MONTHLY:-9900}
    PRICE_ONE_TIME: ${PRICE_ONE_TIME:-149000}
    PRICE_LICENSE_RENEWAL: ${PRICE_LICENSE_RENEWAL:-}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agendia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agendia}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  migrate:
    image: agendia-migrator:latest
    build:
      <<: *build
      target: migrator
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  web:
    image: agendia-web:latest
    build: *build
    restart: unless-stopped
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    logging: *logging

  worker:
    image: agendia-web:latest
    restart: unless-stopped
    command: ["node", "scripts/worker.mjs"]
    environment:
      CRON_SECRET: ${CRON_SECRET}
      WORKER_TARGET_URL: http://web:3000
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-60}
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/sites:/etc/caddy/sites:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - default
      - edge
    depends_on:
      - web
    logging: *logging

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-agendia}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-agendia}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-7}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-4}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
      # Después de las migraciones: la primera copia no debe ser de una base vacía.
      migrate:
        condition: service_completed_successfully
    logging: *logging

  # Copia externa de los backups (del SaaS y de las instalaciones
  # independientes). Opcional: se activa con COMPOSE_PROFILES=offsite y un
  # destino configurado en deploy/rclone.conf (ver docs/DEPLOYMENT.md).
  offsite:
    profiles: ["offsite"]
    image: rclone/rclone:1.68
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/offsite.sh"]
    environment:
      OFFSITE_REMOTE: ${OFFSITE_REMOTE:-}
    volumes:
      - ./deploy/offsite.sh:/offsite.sh:ro
      - ./deploy/rclone.conf:/config/rclone/rclone.conf:ro
      - ${BACKUP_DIR:-./backups}:/data/saas:ro
      - ./instances:/data/instances:ro
    logging: *logging

networks:
  edge:
    name: agendia-edge

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
