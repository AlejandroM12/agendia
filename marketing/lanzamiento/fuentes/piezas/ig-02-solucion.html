<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instagram 2 — Tu propia página de reservas</title>
<link rel="stylesheet" href="base.css">
<style>
  .piece { background: var(--pine); }
  .halo { position: absolute; border-radius: 50%; }
  h1 { position: absolute; left: 80px; top: 88px; width: 920px; font-size: 92px; line-height: 1.02; color: #fbf9f5; font-variation-settings: "opsz" 56; letter-spacing: -0.012em; }
  h1 em { color: var(--peach); }
  .p-left  { position: absolute; left: 8px;  top: 568px; --w: 292px; transform: rotate(-7deg); }
  .p-right { position: absolute; right: 8px; top: 568px; --w: 292px; transform: rotate(7deg); }
  .p-main  { position: absolute; left: 50%; top: 392px; --w: 400px; margin-left: -200px; z-index: 3; }
  .chip { position: absolute; z-index: 5; }
  .qr { position: absolute; z-index: 5; right: 44px; top: 880px; width: 230px; padding: 20px 20px 18px; border-radius: 30px; background: #fff; color: var(--ink); transform: rotate(4deg);
        box-shadow: 0 26px 56px rgba(8, 25, 20, .45), 0 0 0 1.5px rgba(29,27,24,.06); }
  .qr img { display: block; width: 190px; height: 190px; }
  .qr p { margin-top: 12px; font-weight: 700; font-size: 22px; line-height: 1.15; text-align: center; color: var(--pine); }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 62px; display: flex; align-items: center; justify-content: space-between; color: #fbf9f5; z-index: 6; }
  .foot .url { font-weight: 600; font-size: 30px; letter-spacing: -0.005em; color: #f3dfd3; }
</style>
</head>
<body>
<main class="piece ig">
  <div class="halo" style="left:-280px;top:-300px;width:760px;height:760px;background:radial-gradient(circle,rgba(255,255,255,.1),rgba(255,255,255,0) 68%)"></div>
  <div class="halo" style="right:-320px;bottom:-240px;width:900px;height:900px;background:radial-gradient(circle,rgba(200,100,60,.42),rgba(200,100,60,0) 66%)"></div>

  <h1 class="display">Tu negocio.<br><em>Tu propia página</em><br>de reservas.</h1>

  <div class="phone p-left"><div class="screen"><img src="../capturas/publica-navaja-inicio.png" alt=""></div></div>
  <div class="phone p-right"><div class="screen"><img src="../capturas/publica-kine-inicio.png" alt=""></div></div>
  <div class="phone p-main"><div class="screen"><img src="../capturas/publica-mora-inicio.png" alt=""></div></div>

  <div class="chip" style="left:34px;top:1000px">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="6.5" cy="12" r="2.5"/><circle cx="14.5" cy="17.5" r="2.5"/><path d="M17 12a5 5 0 0 1-5 5" /></svg></span>
    Tu logo y tus colores
  </div>
  <div class="chip terra" style="right:34px;top:626px">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span>
    Reservas online
  </div>
  <div class="chip" style="left:34px;top:1086px">
    <span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1 1"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1-1"/></svg></span>
    Enlace para compartir
  </div>
  <div class="qr">
    <img src="assets/qr.svg" alt="">
    <p>Código QR para tu local</p>
  </div>

  <div class="foot">
    <div class="logo" style="color:#fbf9f5">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#fbf9f5"/><rect x="8" y="9" width="16" height="15" rx="3.5" fill="none" stroke="#1f4d3f" stroke-width="2"/><path d="M12 7v4M20 7v4" stroke="#1f4d3f" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="18.5" r="2.4" fill="#c8643c"/></svg>
      <span>Agendia</span>
    </div>
    <div class="url">agendia.atajolab.dev</div>
  </div>
  <p class="note light">Vista ilustrativa con datos de ejemplo.</p>
</main>
</body>
</html>
