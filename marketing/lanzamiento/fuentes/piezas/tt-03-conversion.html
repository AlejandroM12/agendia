<!doctype html>
<html lang="es">
<head>

<link rel="stylesheet" href="base.css">
<style>

  .piece { background: var(--pine); }

  .brand { position: absolute; left: 70px; top: 196px; display: flex; align-items: center; gap: 18px; color: #fbf9f5; }

  .browser { position: absolute; left: 60px; top: 626px; --w: 650px; z-index: 2; }

  .phone { position: absolute; right: 118px; top: 520px; --w: 322px; z-index: 4; transform: rotate(3deg); }
  .free { position: absolute; left: 70px; top: 1262px; font: 600 48px/1.1 "Fraunces", serif; color: #fbf9f5; letter-spacing: -0.015em; font-variation-settings: "opsz" 48; width: 850px; }
  .free em { color: var(--peach); }
  .cta { position: absolute; left: 70px; top: 1334px; font-size: 36px; padding: 24px 40px; z-index: 6; }
  .url { position: absolute; left: 70px; top: 1440px; font: 600 34px/1 "Geist"; color: #f3dfd3; z-index: 6; }

</style>
</head>
<body>
