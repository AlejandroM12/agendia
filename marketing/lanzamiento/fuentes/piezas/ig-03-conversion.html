<link rel="stylesheet" href="base.css">
<style>

  .cta-band { position: absolute; left: 54px; right: 54px; bottom: 50px; height: 164px; border-radius: 40px; background: var(--pine); color: #fbf9f5; z-index: 8; display: flex; align-items: center; justify-content: space-between; padding: 0 40px 0 48px; box-shadow: 0 30px 60px rgba(31, 77, 63, .35); }

  .cta-band .cta { font-size: 31px; padding: 22px 34px; white-space: nowrap; }
  .tag { position: absolute; left: 54px; top: 1038px; z-index: 5; }
