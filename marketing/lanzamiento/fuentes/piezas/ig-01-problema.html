<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Instagram 1 — El problema</title>
<link rel="stylesheet" href="base.css">
<style>
  .glow { position: absolute; border-radius: 50%; filter: blur(2px); }
  h1 { position: absolute; left: 80px; top: 104px; width: 920px; font-size: 104px; line-height: 1.02; font-variation-settings: "opsz" 56; letter-spacing: -0.012em; color: var(--ink); }
  h1 em { color: var(--terra); }
  .lede { position: absolute; left: 80px; top: 462px; width: 920px; font-size: 39px; line-height: 1.25; color: var(--muted); font-weight: 450; letter-spacing: -0.01em; }
  .lede b { color: var(--ink); font-weight: 600; }
  .badge { position: absolute; right: 70px; top: 530px; min-width: 120px; height: 120px; padding: 0 30px; border-radius: 60px; background: var(--terra); color: #fff; display: grid; place-items: center; font: 700 54px/1 "Geist"; box-shadow: 0 16px 36px rgba(169, 81, 44, .42); transform: rotate(6deg); }
  .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: linear-gradient(to bottom, rgba(250,247,242,0), var(--paper) 78%); }
  .foot { position: absolute; left: 80px; right: 80px; bottom: 64px; display: flex; align-items: center; justify-content: space-between; }
  .foot .hint { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 28px; color: var(--pine); }
  .foot .hint svg { width: 30px; height: 30px; }
  .line { position: absolute; left: 0; width: 100%; top: 410px; height: 1px; }
</style>
</head>
<body>
<main class="piece ig">
  <div class="glow" style="left:-220px;top:-260px;width:620px;height:620px;background:radial-gradient(circle,#f8e9e1 0%,rgba(248,233,225,0) 70%)"></div>
  <div class="glow" style="right:-260px;top:520px;width:760px;height:760px;background:radial-gradient(circle,#e3ede8 0%,rgba(227,237,232,0) 68%)"></div>

  <h1 class="display">¿Seguís coordinando turnos <em>por mensajes?</em></h1>
  <p class="lede"><b>Organizá tu agenda</b> y recuperá tu tiempo.</p>
  <div class="badge">99+</div>

  <!-- Conversaciones: ilustran el problema, con el ritmo de un día cualquiera -->
  <div class="bubble in" style="left:80px;top:600px;transform:rotate(-1deg)">Hola! ¿Tenés turno para mañana?<small>21:47</small></div>
  <div class="bubble out" style="right:80px;top:726px;transform:rotate(1deg)">Mañana a las 10 tengo lugar<small>07:05</small></div>
  <div class="bubble in" style="left:80px;top:852px;transform:rotate(.8deg)">¿Y el jueves? ¿Hasta qué hora?<small>07:12</small></div>
  <div class="bubble in" style="right:80px;top:978px;transform:rotate(-1deg)">¿Puedo mover mi turno del viernes?<small>12:36</small></div>
  <div class="bubble out" style="left:80px;top:1104px;transform:rotate(1deg)">Perdón, recién veo tu mensaje<small>23:12</small></div>

  <div class="foot">
    <div class="logo" style="color:var(--ink)">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1f4d3f"/><rect x="8" y="9" width="16" height="15" rx="3.5" fill="none" stroke="#fbf9f5" stroke-width="2"/><path d="M12 7v4M20 7v4" stroke="#fbf9f5" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="18.5" r="2.4" fill="#c8643c"/></svg>
      <span>Agendia</span>
    </div>
    <div class="hint">Deslizá
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </div>
  </div>
</main>
</body>
</html>
